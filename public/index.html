<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Expenses AI Scanner</title>
  
  <!-- Manifest link -->
  <link rel="manifest" href="manifest.json">
  
  <!-- CSS Styling -->
  <link rel="stylesheet" href="style.css">
  
  <!-- iOS Safari Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses Scanner">
  <meta name="theme-color" content="#4f46e5">
</head>
<body>

  <div class="container">
    <header class="app-header">
      <h1>ماسح المصاريف الشهرية</h1>
      <p class="subtitle">تتبع مصاريفك بسهولة باستخدام الذكاء الاصطناعي</p>
    </header>

    <main class="main-content">
      <div class="card scanner-card">
        <div class="upload-area" id="uploadArea">
          <div class="icon-container">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
          <h3>مسح الفاتورة أو الإيصال</h3>
          <p>المس هنا لالتقاط صورة أو رفع ملف</p>
          <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
        </div>
      </div>

      <div class="card stats-card">
        <h3>إجمالي المصاريف هذا الشهر</h3>
        <div class="total-amount" id="totalAmount">0.00 د.إ</div>
      </div>

      <div class="card history-card">
        <h3>أحدث العمليات المسجلة</h3>
        <ul class="expense-list" id="expenseList">
          <li class="empty-state">لا توجد مصاريف مسجلة حتى الآن</li>
        </ul>
      </div>
    </main>
  </div>

  <!-- JavaScript Modules -->
  <script src="app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registered successfully:', reg.scope))
          .catch(err => console.error('PWA Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
