<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#17324d" />
<title>مصاريف الشهر — 7.1.0</title>
<style>
  html,body{margin:0;min-height:100%;background:#f4eadb;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
  .boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{background:#fffaf2;border:1px solid #dfd2bf;border-radius:22px;padding:22px;max-width:440px;box-shadow:0 16px 45px rgba(35,50,68,.1)}
  .spin{width:34px;height:34px;border-radius:50%;border:4px solid #dfd2bf;border-top-color:#17324d;margin:0 auto 14px;animation:s .8s linear infinite}
  .btn{border:0;background:#17324d;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;margin-top:10px}
  .sub{font-size:13px;color:#6d7780;line-height:1.7}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="appVersionFooter" data-version="7.1.0" hidden></div>
<div class="boot">
  <div class="card">
    <div class="spin"></div>
    <strong>جارٍ تشغيل الإصدار 7.1.0</strong>
    <p>يتم تحميل النسخة الأساسية الآمنة وتطبيق نظام اعتماد التحديثات.</p>
    <p class="sub" id="bootDetail">تجاوز ذاكرة Service Worker القديمة…</p>
  </div>
</div>

<script>
(async()=>{
  const card=document.querySelector('.card');
  const detail=document.getElementById('bootDetail');

  function showFailure(message){
    card.innerHTML=
      `<strong>تعذر تشغيل الإصدار</strong>
       <p>${String(message||'خطأ غير معروف')}</p>
       <button class="btn" id="safeOpenBtn">فتح النسخة الآمنة</button>
       <button class="btn" id="retryBtn" style="background:#6b7d8d">إعادة المحاولة</button>`;
    document.getElementById('safeOpenBtn').onclick=()=>{
      location.replace(`/?__sw_recovery=1&__raw_base=1&v=${Date.now()}`);
    };
    document.getElementById('retryBtn').onclick=()=>location.reload();
  }

  try{
    // IMPORTANT:
    // __sw_recovery makes v7.0.6 Service Worker ignore this request.
    // __raw_base tells the Worker release gate to return the real stable index.html
    // instead of the owner-only 7.1.0 loader again.
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);
    const r=await fetch(
      `/index.html?__raw_base=1&__sw_recovery=1&v=${Date.now()}`,
      {cache:'no-store',credentials:'include',signal:controller.signal}
    );
    clearTimeout(timer);

    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    let html=await r.text();

    // Guard against accidental recursion even if an intermediary returns this loader.
    if(/جارٍ تشغيل الإصدار 7\.1\.0/.test(html) && /__raw_base=1/.test(html)){
      throw new Error('تم اكتشاف حلقة تحميل قديمة. استخدم «فتح النسخة الآمنة» ثم أعد المحاولة.');
    }

    if(detail)detail.textContent='تم تحميل النسخة الأساسية، جارٍ تفعيل 7.1.0…';

    html=html
      .replace(/data-version=["']7\.0\.(5|6)["']/g,'data-version="7.1.0"')
      .replace(/const APP_VERSION='7\.0\.(5|6)';/,"const APP_VERSION='7.1.0';")
      .replace(/const CURRENT_APP_VERSION='7\.0\.(5|6)';/,"const CURRENT_APP_VERSION='7.1.0';")
      .replace(/versionFooter:'الإصدار 7\.0\.(5|6)[^']*'/,
               "versionFooter:'الإصدار 7.1.0 — اعتماد التحديثات من المالك + إشعارات فورية'")
      .replace(/versionFooter:'Version 7\.0\.(5|6)[^']*'/,
               "versionFooter:'Version 7.1.0 — owner-approved releases + instant notifications'")
      .replace(/الإصدار 7\.0\.(5|6)[^<\n]*/,
               'الإصدار 7.1.0 — اعتماد التحديثات من المالك + إشعارات فورية')
      .replace(
        "if(v&&v!==CURRENT_APP_VERSION)show(null,v)",
        "if(v&&String(v).localeCompare(String(CURRENT_APP_VERSION),undefined,{numeric:true,sensitivity:'base'})>0)show(null,v)"
      );

    const changelogNeedle='const CHANGELOG_ENTRIES=[';
    if(html.includes(changelogNeedle)&&!html.includes("{version:'7.1.0'")){
      html=html.replace(
        changelogNeedle,
        `${changelogNeedle}
  {version:'7.1.0',ar:'إضافة نظام إصدار مرحلي: التحديث يصل أولًا لمالك الصفحة للتجربة، ولا يصل للمستخدمين إلا بعد الاعتماد. بعد الاعتماد يُرسل إشعار فوري داخل التطبيق وعبر إشعارات النظام للأجهزة المشتركة، مع الإبقاء على النسخة الاحتياطية والتحديث اليدوي.',en:'Added staged releases: the owner receives and tests each candidate first; users receive it only after approval. Approval triggers immediate in-app and system push notifications for subscribed devices while preserving backup-first manual updating.'},`
      );
    }

    const releaseScripts=
      `<script>window.__APP_RELEASE_VERSION__='7.1.0';window.__APP_RELEASE_CHANNEL__='managed';<\/script>`+
      `<script src="/release-manager.js?v=7.1.0"><\/script>`;

    html=html.replace(/<\/body>/i,`${releaseScripts}\n</body>`);
    document.open();
    document.write(html);
    document.close();

  }catch(e){
    const msg=e?.name==='AbortError'
      ? 'انتهت مهلة تحميل النسخة الأساسية. قد يكون Service Worker القديم ما زال يعترض الطلب.'
      : String(e?.message||e);
    showFailure(msg);
  }
})();
</script>
</body>
</html>
